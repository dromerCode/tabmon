[package]
name = "tabmon"
version = "0.1.0"
edition = "2024"
description = "Use an Android tablet as an extended monitor on niri (vkms + wayvnc + adb)"
license = "MIT"
repository = "https://github.com/pichaDev/tabmon"
readme = "README.md"
keywords = ["niri", "wayland", "vnc", "tablet", "monitor"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["fs", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
